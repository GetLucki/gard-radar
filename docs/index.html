<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gård-radar</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2a1f;--muted:#6b7266;--accent:#2f6b3a;--accent2:#b5541c;--line:#e3e0d6;--good:#2f6b3a;--warn:#b5541c}
@media (prefers-color-scheme:dark){:root{--bg:#141712;--card:#1d221b;--ink:#e9ede4;--muted:#9aa394;--line:#2c3329;--accent:#7fc08a;--accent2:#e58a4d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:28px;margin:0 0 4px}h2{font-size:20px;margin:28px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sub{color:var(--muted);margin-bottom:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#ccc}
.card .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.t{font-weight:600;font-size:16px}.m{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{font-weight:700;font-size:17px}.score{font-weight:700;color:var(--accent);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip.on{color:var(--accent);border-color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent);color:#fff}
.tag.cut{background:var(--accent2)}.tag.new{background:#2f5fa8}
a{color:inherit}.links a{font-size:13px;color:var(--accent);margin-right:10px}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-size:26px;font-weight:700}.stat .l{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:12px}
.top{border-left:5px solid var(--accent)}.why{font-size:14px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}select,input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
.small{font-size:12px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:2px;height:40px}.spark i{display:block;width:8px;background:var(--accent);border-radius:2px 2px 0 0;opacity:.8}
</style>
</head>
<body><div class="wrap">
<h1>Gård-radar</h1>

<div id="market"></div>

<div id="changes"></div>

</div>
<div class="grid" id="list"></div>

slövs Ängar 222", "kommun": "Laholm", "price": 4200000, "land_ha": 3.0, "score": 13, "url": "https://www.booli.se/annons/6132635"}, {"id": "booli:6132250", "title": "Fjäll Kasängen", "kommun": "Bengtsfors", "price": 2300000, "land_ha": 7.59, "score": 12, "url": "https://www.booli.se/annons/6132250"}, {"id": "booli:6012355", "title": "Hämnäs Åmot 1", "kommun": "Årjäng", "price": 2000000, "land_ha": 3.83, "score": 10, "url": "https://www.booli.se/annons/6012355"}, {"id": "booli:6084899", "title": "Östantorp 142", "kommun": "Vimmerby", "price": 1250000, "land_ha": 3.68, "score": 4, "url": "https://www.booli.se/bostad/2791236"}], "gone": [{"id": "booli:None", "title": "Lockabäck 103", "kommun": "Hylte", "price": 4500000, "url": "https://www.booli.se/bostad/4559961", "days_tracked": 0}, {"id": "booli:5699238", "title": "Kraksbyn 301", "kommun": "Åmål", "price": 3475000, "url": "https://www.booli.se/bostad/1703812", "days_tracked": 0}], "price_changes": [], "first_run": false}, "recs": {"date": "2026-09-17", "market_summary": "209 listings match the hard filters tonight, 21 of them new since the morning run, and the two listed as gone are re-indexing artefacts (Kraksbyn 301 moved from a Booli id to a Hemnet id, and one Booli record had no id), not sales. Median asking is 2 985 000 kr and median land price about 256 000 kr per hectare; Småland (58) and Dalsland/Värmland (53) carry the supply, Göteborg hinterland is the busiest with 6 new listings and the highest median at 3 325 000 kr. This is the first run under the low-maintenance rules: the house is now judged as a safe house that stands empty, so two of yesterday's three picks (Attlered 122 and Barkerud Sjövik 1) drop and 1960s to 1990s houses move up. Five properties pass the bar, but four of them have thin descriptions, so this week is for asking brokers about facade, roof, windows and water before anyone drives anywhere. Several new Booli-only listings scraped as cookie banners and could not be judged at all.", "top": [{"id": "hemnet:21719773", "title": "Gunnarsjö Bro 1", "kommun": "Varberg", "region": "Halland inland", "price": 3395000, "land_ha": 15.5, "url": "https://www.hemnet.se/bostad/gard-5rum-kungsater-varbergs-kommun-gunnarsjo-bro-1-21719773", "score": 70, "prepping_why": "15.5 ha of open land one hour from Göteborg in Kungsäter, with bergvärme, solar panels and two working vedspisar already installed, so heat and power resilience exist from day one. The 123 m2 house has an 80 m2 basement with a matkällare and laundry, and the ladugård holds a workshop, slaughter room and machine hall. Water source is not stated and must be asked. An empty house on bergvärme can be kept at background heat cheaply, which is exactly the empty-house plan in the doc.", "invest_why": "At 219 000 kr per ha the land is priced below the 256 000 kr median while sitting in Halland, top three on every five-year price series. Four months on Booli means the seller should take an offer. Weakness for resale is the outbuilding stock: an 1850s timmerhus, hönshus and smedja look charming but add nothing to what a buyer like us will pay.", "rank_why": "Closest, most land and most installed systems of the five; the 1964 build year sits one year under the 1965 line and is treated as the same era. It only stays at the top if the facade and roof turn out to be brick, render or metal.", "maintenance": "Built 1964, 1.5 floors with basement; facade, roof and windows not stated. Within ten years: the older upstairs bathroom, probably window replacement, and a decision to demolish or roof the 1850s timmerhus, hönshus and smedja, which are the real maintenance load here. Empty-house risks: basement damp if the drainage is old, and five separate buildings to secure against break-ins.", "recommendation": "Ask the broker for facade, roof and window materials and the water source first, then book a viewing; the main house is the right era and the land and systems are already in place."}, {"id": "hemnet:21766339", "title": "Västra Mörtnäs 503", "kommun": "Årjäng", "region": "Dalsland/Värmland", "price": 2575000, "land_ha": 10.8, "url": "https://www.hemnet.se/bostad/gard-11rum-arjangs-kommun-vastra-mortnas-503-21766339", "score": 62, "prepping_why": "A 1982 villa of 183 m2 over three floors with three wood-burning stoves (vedkamin, öppen spis with insert, kamin), a sauna and a separate apartment with its own entrance, on 10.8 ha of forest and open land in a secluded spot outside Årjäng with hunting rights. A 1980s house is built on a slab or drained basement and takes standing empty far better than any gård house on this list. Water source and the forest share are not stated.", "invest_why": "238 000 kr per ha is just under the median, in Värmland where villa prices rose 9.1 percent in the last year and Norwegian second-home demand keeps the market liquid. The forest share decides the value floor; ask for it. 29 days on Booli, so no price pressure yet.", "rank_why": "The best house on the list for the safe-house purpose, but 2.4 hours from Göteborg and 5 ha less land than Gunnarsjö Bro 1; it moves to first place if that one fails the facade question.", "maintenance": "Built 1982; facade, roof and windows not stated but likely original 1980s, so expect a roof and window round within ten years if not already done. Empty-house risks: frost in a three-floor water system unless it is drained or kept on background heat, and a remote location that invites break-ins without a neighbour's eye.", "recommendation": "Ask the broker for the water source, forest share, facade and roof materials first; on paper this is the house type the doc asks for."}, {"id": "booli:6212333", "title": "Klägghult 2", "kommun": "Svenljunga", "region": "Göteborg hinterland", "price": 2700000, "land_ha": 7.1, "url": "https://www.booli.se/annons/6212333", "score": 58, "prepping_why": "7.1 ha at Kalv in southern Svenljunga, a lake district on the Halland border 1.2 hours from Göteborg, with a house that Booli lists twice: one record says built 2022 with 150 m2 living and 100 m2 other area, the other says built 1964 with 120 m2. Either year passes the low-maintenance bar and the stated running cost of 3 152 kr per month is low. Water, heating and land mix are unknown because the description scraped as a cookie banner.", "invest_why": "380 000 kr per ha is above the median, so you are paying for the house, which is right if it really is a 2022 build: a new house on 7 ha in this kommun would cost far more to build. One month on the market and listed by LF Fastighetsförmedling, so a skogsbruksplan is unlikely at this size.", "rank_why": "Potentially the best house here and the closest to home, but everything rests on one unverified build year; it cannot rank above properties whose descriptions we have actually read.", "maintenance": "Built 2022 or 1964 depending on the record; if 2022, nothing but service for ten years; if 1964, ask for roof and window dates. Empty-house risks: unknown water system and no information on neighbours or road visibility.", "recommendation": "Ask the broker for the true build year, facade, roof, water source and forest share first; if 2022 is confirmed this jumps to first place."}, {"id": "hemnet:21750512", "title": "Norra Skarbol Enebacken", "kommun": "Säffle", "region": "Dalsland/Värmland", "price": 3500000, "land_ha": 10.8, "url": "https://www.hemnet.se/bostad/gard-6rum-svanskog-saffle-kommun-norra-skarbol-enebacken-21750512", "score": 55, "prepping_why": "A 1994 house of 131 m2 with six rooms, a guest house and a stable with seven boxes, on 10.8 ha in one piece around the buildings just north of Svanskog. The single-block land and the second dwelling fit the plan; water, heating and the forest share are not stated. A 1990s house drains and winterises easily.", "invest_why": "324 000 kr per ha is above the median, so the price carries the buildings; Svanskog is a lake village with Norwegian buyers within reach. Two months on Booli and 4 700 page views suggest interest without a sale, so there is room to negotiate.", "rank_why": "Newest house of the verified descriptions, but less land value per krona than the three above and no stated wood heating or water; 2.2 hours from Göteborg.", "maintenance": "Built 1994; facade, roof and windows not stated, likely original, so expect a roof inspection and window round within ten years. Stable and guest house are two extra roofs to maintain. Empty-house risks: frost in the stable water line, and a horse farm that looks abandoned attracts visitors.", "recommendation": "Ask the broker for heating, water source and forest share first; skip if there is no wood heating and no forest."}, {"id": "hemnet:19391342", "title": "Stora Mosshult 6", "kommun": "Laxå", "region": "Skaraborg/Vättern", "price": 4995000, "land_ha": 19.0, "url": "https://www.hemnet.se/bostad/gard-6rum-laxa-kommun-stora-mosshult-6-19391342", "score": 50, "prepping_why": "A 1980 villa of 180 m2 with four bedrooms and two bathrooms, a lillstuga with a working vedspis, an insulated 100 m2 workshop on a cast slab, and 19 ha of which about 10 ha is arable on a hilltop in the heart of Tiveden near lakes Unden and Grytsjön. That is the most arable land and the most food capacity on this list. Water source and main-house heating are not stated.", "invest_why": "263 000 kr per ha is at the median but the asking price sits at the very top of the budget and the listing id is old, which means it has been on and off the market for a long time. Tiveden national park is a genuine tourism draw; Laxå kommun is a thin resale market.", "rank_why": "The house and land are right, but 2.6 hours from Göteborg breaks the 2.5-hour rule, the price is the ceiling, and an unfinished truck-garage extension is a half-built liability.", "maintenance": "Built 1980; facade and roof not stated, workshop has two-glass windows so the house probably does too. Within ten years: finish or remove the unfinished garage extension, likely window replacement. Empty-house risks: frost in a large two-bathroom water system, and the long drive means fewer visits.", "recommendation": "Watch, wait for a price cut; at 4 995 000 kr and 2.6 hours it is right on paper but wrong on price and distance."}], "dropped": [{"id": "hemnet:21774015", "title": "Attlered 122", "why": "Re-read under the low-maintenance rules: no build year, no renovation history, no water source and no wood heating stated for a 1.5-floor gård house described as charming; the land is still excellent, so it moves to the watch list until the broker confirms the house."}, {"id": "hemnet:21571650", "title": "Barkerud Sjövik 1", "why": "Built 1909 with two old villas, so two painted timber houses to keep alive; fails the low-maintenance bar and bidding has started after a year on the market."}], "criteria_changes": [], "watch": [{"id": "hemnet:21774015", "title": "Attlered 122", "note": "22 ha in one piece with 17 ha forest for 2 950 000 kr, 50 minutes from Göteborg; back on the list if the broker confirms a post-1965 house or a documented total renovation."}, {"id": "hemnet:21786708", "title": "Boarp Stakagård 1", "note": "2 000 m3sk of forest is worth about 1 860 000 kr at southern prices, so the 1933 house costs about 840 000 kr; the house fails the bar but the land is the cheapest forest on the list."}, {"id": "hemnet:21741956", "title": "Gennevedsvägen 108", "note": "34.6 ha for 2 975 000 kr, 40 minutes from Göteborg, 1909 house renovated in recent years; worth a call for the renovation paperwork and the land split."}, {"id": "hemnet:21769758", "title": "Intagan 128", "note": "1975 house 50 minutes from Göteborg with 12 ha, but no forest, no wood heating stated and it lies on the Göta älv side that the doc says to avoid for landslide risk."}, {"id": "hemnet:21729254", "title": "Törestorp 5", "note": "House in very good condition on 18 ha with a new stable 50 minutes from Göteborg, but 4 900 000 kr and no build year; ask before dismissing."}, {"id": "booli:6271712", "title": "Gunnarsjö Gudmundared 2", "note": "29 ha for 3 999 000 kr in the same village as Gunnarsjö Bro 1, listed today as coming soon; 1936 house so land play only."}, {"id": "hemnet:21748189", "title": "Grönlanda 8", "note": "Modern energy-efficient villa plus torp in a fully secluded spot, but only 4.7 ha for 4 300 000 kr; worth a look if the price drops below 3 500 000 kr."}]}, "history": [{"date": "2026-09-17", "matched": 209, "median_price": 2985000, "new": 21}]}</script>

  ['Matching listings', S.matched], ['New today', S.new], ['Gone', S.gone], ['Price cuts', S.price_cuts],
  ['Median asking', kr(S.median_price)], ['Median kr/ha', kr(S.median_price_per_ha)]
].map(([l,v])=>`<div class="stat"><div class="v">${v??'–'}</div><div class="l">${l}</div></div>`).join('');

// recommendations
const R = D.recs||{}; const byId = Object.fromEntries(D.listings.map(l=>[l.id,l]));
let rh='';
const TOP = R.top || R.top3 || [];
if (TOP.length){
  rh += `<div class="grid">` + TOP.map((r,i)=>{ const l = byId[r.id]||{}; return `<div class="card top">${l.image?`<img src="${esc(l.image)}" alt="">`:''}<div class="b">
    <div class="row"><span class="tag">#${i+1}</span><span class="score">${r.score??l.score??''}</span></div>
    <div class="t"><a href="${esc(r.url||l.url)}" target="_blank" rel="noopener">${esc(r.title||l.title)}</a></div>
    <div class="m">${esc(r.kommun||l.kommun)} · ${esc(l.region||'')} · ${l.land_ha?l.land_ha+' ha':''} ${l.living_m2?'· '+l.living_m2+' m²':''} ${l.drive_h?'· '+l.drive_h+' h':''}</div>
    <div class="price">${kr(r.price||l.price)}</div>
    <div class="why">${r.prepping_why?`<b>Survival:</b> ${esc(r.prepping_why)}<br>`:''}${r.invest_why?`<b>Investment:</b> ${esc(r.invest_why)}<br>`:''}${r.rank_why?`<b>Rank:</b> ${esc(r.rank_why)}<br>`:''}${r.maintenance?`<b>Maintenance:</b> ${esc(r.maintenance)}<br>`:''}${r.recommendation?`<b>Recommendation:</b> ${esc(r.recommendation)}`:esc(r.why||'')}</div></div></div>`}).join('') + `</div>`;
  if (R.dropped && R.dropped.length) rh += `<p class="small" style="margin-top:10px"><b>Dropped from the top three:</b> ` + R.dropped.map(d=>`${esc(d.title)} (${esc(d.why)})`).join('; ') + `</p>`;
  rh += `<p class="small">Recommendations dated ${esc(R.date||'')}.</p>`;
} else rh = `<div class="note">No recommendations yet. The Claude step writes them after the first full run.</div>`;
document.getElementById('recs').innerHTML = rh;

// market
let mh = R.market_summary ? `<div class="note">${esc(R.market_summary)}</div>` : '';
const reg = S.by_region||{};
mh += `<table style="margin-top:12px"><tr><th>Region</th><th>Listings</th><th>New</th><th>Median asking</th></tr>` +
  Object.entries(reg).sort((a,b)=>b[1].count-a[1].count).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.count}</td><td>${v.new}</td><td>${kr(v.median_price)}</td></tr>`).join('') + `</table>`;
const fmtTot = v => v==null ? '–' : (typeof v==='object' ? Object.entries(v).map(([k,n])=>`${n??'–'} ${k}`).join(', ') : v);
if (S.national_in_band) mh += `<p class="small">Nationally in the price band today: Hemnet ${fmtTot(S.national_in_band.hemnet)}; Booli ${fmtTot(S.national_in_band.booli)}.</p>`;
if (D.history && D.history.length>1){
  const max = Math.max(...D.history.map(h=>h.matched||0),1);
  mh += `<div class="small" style="margin-top:8px">Matching listings, last ${D.history.length} runs</div><div class="spark">` + D.history.map(h=>`<i title="${h.date}: ${h.matched}" style="height:${Math.max(3,Math.round(40*h.matched/max))}px"></i>`).join('') + `</div>`;
}
document.getElementById('market').innerHTML = mh;

// changes
const C = D.changes||{}; let ch='';
if (C.first_run) ch += `<div class="note">First run: everything counts as new. Changes will be meaningful from tomorrow.</div>`;
else {
  ch += `<table><tr><th>Type</th><th>Listing</th><th>Kommun</th><th>Price</th></tr>`;
  (C.new||[]).forEach(x=> ch += `<tr><td><span class="tag new">new</span></td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></td><td>${esc(x.kommun)}</td><td>${kr(x.price)} · score ${x.score}</td></tr>`);
  (C.price_changes||[]).forEach(x=> ch += `<tr><td><span class="tag ${x.new<x.old?'cut':''}">${x.new<x.old?'price cut':'price up'}</span></td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></td><td>${esc(x.kommun)}</td><td>${kr(x.old)} → ${kr(x.new)}</td></tr>`);
  (C.gone||[]).forEach(x=> ch += `<tr><td><span class="chip">gone</span></td><td>${esc(x.title)}</td><td>${esc(x.kommun)}</td><td>${kr(x.price)} · tracked ${x.days_tracked??'?'} d</td></tr>`);
  ch += `</table>`;
  if (!(C.new||[]).length && !(C.price_changes||[]).length && !(C.gone||[]).length) ch = `<div class="note">No changes since the last run.</div>`;
}
document.getElementById('changes').innerHTML = ch;

// list
const regions = [...new Set(D.listings.map(l=>l.region))].sort();
const fR = document.getElementById('fRegion'); regions.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;fR.appendChild(o)});
const PARTS = {water:'water',land:'land',buildings:'buildings',heating:'heat',maintenance:'low-maint',seclusion:'seclusion',drive:'drive',price:'price'};
function render(){
  const r = fR.value, s = document.getElementById('fSort').value, q = document.getElementById('fText').value.toLowerCase();
  let L = D.listings.filter(l => (!r || l.region===r) && (!q || (l.title+' '+l.kommun+' '+(l.location||'')).toLowerCase().includes(q)));
  const key = {score:l=>-l.score, price:l=>l.price, ha:l=>-(l.land_ha||0), new:l=>-(new Date(l.first_seen)), drive:l=>l.drive_h??99}[s];
  L.sort((a,b)=>key(a)-key(b));
  document.getElementById('list').innerHTML = L.map(l=>{
    const cut = cutIds.get(l.id); const parts = l.score_parts||{};
    return `<div class="card">${l.image?`<img loading="lazy" src="${esc(l.image)}" alt="">`:''}<div class="b">
      <div class="row"><div>${newIds.has(l.id)?'<span class="tag new">new</span> ':''}${cut?`<span class="tag ${cut.new<cut.old?'cut':''}">${cut.new<cut.old?'price cut':'price up'}</span> `:''}${l.upcoming?'<span class="chip">upcoming</span>':''}</div><span class="score">${l.score}</span></div>
      <div class="t"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a></div>
      <div class="m">${esc(l.kommun)} · ${esc(l.region)} · ${esc(l.type||'')}</div>
      <div class="row"><span class="price">${kr(l.price)}</span><span class="m">${l.land_ha?l.land_ha+' ha':'land ?'}${l.price_per_ha?' · '+kr(l.price_per_ha)+'/ha':''}</span></div>
      <div class="m">${l.living_m2?l.living_m2+' m² · ':''}${esc(l.rooms||'')}${l.build_year?' · byggår '+l.build_year:''}${l.drive_h?' · '+l.drive_h+' h from '+esc(D.config.base.name):''} · tracked ${l.days_tracked} d</div>
      <div class="chips">${Object.entries(PARTS).map(([k,lab])=>`<span class="chip ${parts[k]>0?'on':''}">${lab} ${parts[k]??0}</span>`).join('')}</div>
      <div class="chips">${(l.signals||[]).map(x=>`<span class="chip on">${esc(x)}</span>`).join('')}</div>
      <div class="links"><a href="${esc(l.url)}" target="_blank" rel="noopener">${l.source==='hemnet'?'Hemnet':'Booli'}</a>${l.alt_url?`<a href="${esc(l.alt_url)}" target="_blank" rel="noopener">Booli</a>`:''}<span class="small">${esc(l.broker||'')}</span></div>
    </div></div>`}).join('') || '<div class="note">Nothing matches these filters.</div>';
}
['fRegion','fSort','fText'].forEach(id=>document.getElementById(id).addEventListener('input',render)); render();
</script>
</body></html>
